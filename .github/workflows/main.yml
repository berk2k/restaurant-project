name: .NET CI

on:
  push:
    branches: [ server ]
  pull_request:
    branches: [ server ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore restaurant-backend.sln

      - name: Build
        run: dotnet build restaurant-backend.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test restaurant-backend.sln --no-build --configuration Release --logger trx
