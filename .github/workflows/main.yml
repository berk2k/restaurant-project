name: .NET CI

on:
  push:
    branches: [ server ]
  pull_request:
    branches: [ server ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      - name: Restore dependencies
        run: dotnet restore backend/restaurant-backend/restaurant-backend.sln

      - name: Build
        run: dotnet build backend/restaurant-backend/restaurant-backend.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test backend/restaurant-backend/restaurant-backend.sln --no-build --configuration Release --logger trx
