name: .NET CI/CD

on:
  push:
    branches: [ server ]
  pull_request:
    branches: [ server ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      - name: Restore dependencies
        run: dotnet restore backend/restaurant-backend/restaurant-backend.sln

      - name: Build
        run: dotnet build backend/restaurant-backend/restaurant-backend.sln --no-restore --configuration Release

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          ls -la ./backend/restaurant-backend/restaurant-backend/
          docker build -t ${{ secrets.DOCKER_USERNAME }}/restaurant-backend:latest -f ./backend/restaurant-backend/restaurant-backend/Dockerfile ./backend/restaurant-backend/restaurant-backend

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/restaurant-backend:latest
        
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
